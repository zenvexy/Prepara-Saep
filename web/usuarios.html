<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Usuários</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topo">
    <h1>Gerenciamento de Tarefas - Saep</h1>
    <nav class="acoes">
      <a href="usuarios.html" class="destaque">Cadastro de Usuários</a>
      <a href="tarefas.html">Cadastro de Tarefas</a>
      <a href="home.html">Gerenciar Tarefas</a>
    </nav>
  </header>

  <main>
    <h2>Cadastro de Usuários</h2>
    <p id="mensagem" role="status"></p>
    <form id="formUsuario" class="formulario">
      <label>Nome
        <input name="nome" required>
      </label>
      <label>E-mail
        <input name="email" type="email" required>
      </label>
      <button type="submit">Cadastrar</button>
    </form>
  </main>
</body>
</html>
